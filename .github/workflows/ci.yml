name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "notebooks/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "notebooks/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --no-sync ruff check scspill tools benchmarks
      - run: uv run --no-sync ruff format --check scspill tools benchmarks
      - run: uv run --no-sync mypy scspill

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev --python ${{ matrix.python }}
      - run: uv run --no-sync pytest scspill/tests -n auto --cov=scspill --cov-report=term

  test-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --no-sync pytest scspill/tests -m slow
