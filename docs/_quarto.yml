project:
  type: website
  output-dir: _site
  resources:
    - robots.txt

website:
  title: "scspill"
  description: "Synthetic control models with spillover effects, in Python — the effect on the treated unit and the spillover received by every donor."
  favicon: images/favicon.png
  repo-url: https://github.com/quarcs-lab/scspill
  repo-subdir: docs
  repo-actions: [issue, edit]
  navbar:
    background: primary
    left:
      - text: "Home"
        file: index.qmd
      - text: "Get started"
        file: get-started.qmd
      - text: "Models"
        menu:
          - text: "All models — catalogue and roadmap"
            file: models/index.qmd
          - text: "---"
          - text: "sar — Bayesian spatial-autoregressive spillover SCM"
            file: models/sar.qmd
          - text: "cd — synthetic control under a known spillover structure"
            file: models/cd.qmd
      - text: "Case studies"
        menu:
          - text: "Proposition 99 with a known spillover structure (cd vs sar)"
            file: prop99-spillovers.qmd
          - text: "The 2011 secession of South Sudan (sar)"
            file: sudan.qmd
      - text: "For AI / LLMs"
        file: use-with-llms.qmd
      - text: "Articles"
        menu:
          - text: "Validating the sampler (Geweke, prior checks)"
            file: articles/validation.qmd
          - text: "The Monte Carlo simulation study"
            file: articles/simulation-study.qmd
          - text: "Replicating Cao & Dowd (cd)"
            file: articles/cd-replication.qmd
          - text: "The bundled datasets"
            file: articles/datasets.qmd
      - text: "Reference"
        file: reference/index.qmd
      - text: "Changelog"
        file: changelog.qmd
    right:
      - icon: github
        href: https://github.com/quarcs-lab/scspill
  sidebar:
    style: docked
    contents:
      - reference/_sidebar.yml

# The docs execute against the project venv via a registered kernelspec (a
# user-level `python3` kernel can otherwise shadow it). Register with:
#   uv run python -m ipykernel install --user --name scspill
jupyter: scspill

execute:
  freeze: auto

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    include-in-header:
      # Fully-qualified URLs: Quarto rewrites root-relative hrefs.
      text: |
        <link rel="alternate" type="text/markdown" href="https://quarcs-lab.github.io/scspill/llms.txt" title="llms.txt for LLMs">
        <link rel="alternate" type="text/plain" href="https://quarcs-lab.github.io/scspill/llms-full.txt" title="llms-full.txt for LLMs">

metadata-files:
  - reference/_sidebar.yml

quartodoc:
  package: scspill
  parser: numpy
  title: API Reference
  sidebar: reference/_sidebar.yml
  dir: reference
  render_interlinks: true
  sections:
    - title: Estimator
      desc: >-
        Configure once, fit once. `SCSPILL(config).fit()` runs the spillover
        model named by `method` — `"sar"` (default), the Bayesian spatial
        sampler, or `"cd"`, Cao & Dowd's all-unit synthetic controls under a
        known exposure structure with P-test inference — and returns a
        `SCSPILLResults` holding the shared effect surface and the model's own
        fit. The [model catalogue](../models/index.qmd) says which models
        exist.
      package: scspill.estimators.scspill
      contents:
        - SCSPILL
    - title: Configuration
      desc: >-
        One pydantic input contract for every model: `method`, the long panel
        and its column names, and the fields each model reads, marked
        `(method='sar')` or `(method='cd')`. For `sar`: the spatial weights
        `spatial_w` / `spatial_W`, covariates, the MCMC budget, priors, and
        the paper-correct switches (`beta_prior`, `propagate_alpha`,
        `adapt_rho`). For `cd`: the exposure structure (`affected_units`,
        `spillover_structure`, `unit_distances`, `effect_matrix`), `weighting`,
        and the inference switches (`quantile_method`, `ci_method`,
        `reference_mode`). Setting a field of the model you did not select
        is an error.
      package: scspill.utils.scspill_helpers.config
      contents:
        - SCSPILLConfig
    - title: Results
      desc: >-
        One result type for every model. The shared surface — `att`, `att_ci`,
        `counterfactual`, `gap`, `donor_weights`, the time-by-control
        spillover panel with its bands, and `plot()` — works for both; the
        model's own fit sits in a typed slot (`result.sar`, `result.cd`).
        `sar` adds the posterior blocks and `diagnostics()`; `cd` adds
        `effects_panel`, `effect_ci`, `pointwise_p_values`, `kappa_test`,
        `test_hypothesis()` and `select_structure_by_kappa()`. Accessors of
        the other model raise `AttributeError`.
      package: scspill.utils.scspill_helpers.structures
      contents:
        - SCSPILLResults
    - title: Result containers
      desc: >-
        The frozen dataclasses behind a result — the model-agnostic prepared
        panel and effect contract, the `sar` model's inputs and posterior
        blocks, and the `cd` model's inputs, fit, P tests, efficient
        estimator, sensitivity weights and structure selection.
      package: scspill.utils.scspill_helpers
      contents:
        - containers.PanelInputs
        - containers.SCSPILLEffects
        - sar.structures.SARInputs
        - sar.structures.AlphaPosterior
        - sar.structures.SARPosterior
        - cd.structures.CDInputs
        - cd.structures.CDFit
        - cd.structures.CDTestResult
        - cd.structures.CDEfficientFit
        - cd.structures.PureDonorSensitivity
        - cd.structures.KappaSelection
    - title: Validation & prior checks
      desc: >-
        The `sar` article's appendix machinery as user-facing functions — the
        Geweke (2004) joint distribution test of that model's Step-2 sampler
        (simplified and production kernels), prior-sensitivity re-runs across
        hyperparameter grids, and prior predictive checks against nine summary
        statistics of the pre-treatment donor panel. These target `sar`; the
        Geweke harness already accepts a custom kernel, so a model added later
        plugs in here rather than replacing it.
      package: scspill.validation
      contents:
        - geweke_test
        - prior_sensitivity
        - prior_predictive
        - run_posterior_mcmc
        - ppc_stats
        - plot_geweke
        - plot_prior_predictive
    - title: Simulation
      desc: >-
        The `sar` article's Monte Carlo engine — simulate spillover panels from
        a known SAR data-generating process on a rook lattice, fit the
        classical SCM, the Bayesian horseshoe SCM, and `sar` on each
        replication, and score bias, RMSE, and coverage (its Tables 1–2
        design). This is that model's design, not a package-wide framework.
      package: scspill.simulate
      contents:
        - scspill_sim_dgp
        - run_one_sim
        - run_many_sim
        - summarize_many
        - mc_grid
        - load_r_mc_reference
        - rook_W
        - make_w
    - title: Diagnostics
      desc: >-
        Model-agnostic convergence diagnostics for posterior chains — effective sample
        size, split-chain R-hat, Monte Carlo standard errors, Geweke z-scores,
        and the posterior summary table behind `SCSPILLResults.diagnostics()`.
      package: scspill.utils.diagnostics
      contents:
        - ess_acf
        - split_rhat
        - mcse_from_ess
        - geweke_z
        - mcmc_summary
    - title: Datasets
      desc: >-
        Three bundled panels, each returned as a `SpillPanel` whose
        `config_kwargs()` feeds `SCSPILLConfig` directly: the `sar` article's
        39-state California and 34-country Sudan panels with their spatial
        weights, and Cao & Dowd's 51- (or 41-) unit Proposition 99 panel,
        treated from 1989, with the paper's exposed states.
      package: scspill.data
      contents:
        - load_california
        - load_sudan
        - SpillPanel
        - load_california_cd
